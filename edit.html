<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Content Studio · Seth Taylor</title><link rel="stylesheet" href="assets/style.css"><style>main{max-width:1000px;padding:40px 25px 80px;margin:auto}h1{font-size:64px;letter-spacing:-3px;line-height:1;margin:25px 0}h2{font-size:30px;letter-spacing:-1px} .note{max-width:720px;color:var(--muted)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}button,.file-label{cursor:pointer;border:1px solid var(--line);background:transparent;padding:9px 16px;font-size:12px}.primary{background:var(--blue);color:white;border-color:var(--blue)}details{border-top:1px solid var(--line);padding:20px 0}summary{cursor:pointer;font-size:18px} .fields{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:25px 0}label{font-size:11px;color:var(--muted);display:block}input,textarea,select{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);background:#fffefa;color:var(--ink);border-radius:0}textarea{min-height:95px}.wide{grid-column:1/-1}.row-actions{display:flex;gap:10px;margin-bottom:15px}.status{font-size:13px;color:var(--blue)}.file-label input{display:none}.danger{color:#a33}@media(max-width:600px){.fields{grid-template-columns:1fr}h1{font-size:48px}}</style><script src="assets/editor.js" defer></script></head><body><main><a href="index.html">← Back to website</a><p class="eyebrow" style="margin-top:35px">YOUR CONTENT, IN ONE PLACE</p><h1>Content Studio<span class="blue">.</span></h1><p class="note">Update your profile, CV, publications, selected talks, and gallery. Drafts stay in this browser. Preview your changes, then download <strong>site.json</strong> and replace <strong>content/site.json</strong> in your GitHub repository to publish them.</p><div class="actions"><button class="primary" id="download">Download site.json ↓</button><button id="preview">Preview draft ↗</button><label class="file-label">Import content<input id="import" type="file" accept="application/json,.json"></label><button id="reset">Reset draft</button></div><p id="status" class="status" role="status" aria-live="polite"></p><div id="editor"></div></main></body></html>
